[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer_support_pipeline"
version = "1.0.0"
description = "Deterministic customer-support call analysis pipeline with diarization, ASR, punctuation, intent extraction, and call evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "ML Engineering Team" }
]
keywords = ["vllm", "indic-conformer", "pyannote", "diarization", "asr", "qwen", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyannote.audio>=4.0.0",
    "transformers>=4.48.0",
    "accelerate>=0.34.0",
    "huggingface-hub>=0.25.0",
    "safetensors>=0.4.5",
    "tokenizers>=0.20.0",
    "onnxruntime>=1.18.0",
    "onnx>=1.16.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.6.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
]

[project.scripts]
csp-run = "customer_support_pipeline.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["customer_support_pipeline*"]
